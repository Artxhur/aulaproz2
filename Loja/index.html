<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title>LOJA DO AMOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-search img {
            width: 20px;
            height: 20px;
        }
        #campo-pesquisa {
            max-width: 300px;
        }
    </style>
    <script src="js/main.js" defer></script>
</head>
<body data-bs-theme ="dark">
    <header class="navbar bg-dark p-3 d-flex justify-content-between align-items-center">
        <h1 class="text-danger mb-0">AMOR STORE</h1>

        <form id="form-pesquisa" class="d-flex gap-2 flex-grow-1 justify-content-center mx-3">
            <input type="search" id="campo-pesquisa" class="form-control" tabindex="0" placeholder="Buscar produtos...">
            <button type="submit" class="btn btn-secondary btn-search" tabindex="0">
                <img src="assets/images/lupa.png" alt="Pesquisar">
            </button>
        </form>

        <div class="d-flex gap-2">
            <button id="trocaTema" class="btn btn-secondary" tabindex="0" title="Trocar tema">🌓</button>
            <button id="aumenta" class="btn btn-secondary" tabindex="0" title="Aumentar fonte">A+</button>
            <button id="diminui" class="btn btn-secondary" tabindex="0" title="Diminuir fonte">A-</button>
            <button id="lerPG" class="btn btn-secondary" tabindex="0" title="Ler página">Ler</button>
        </div>
    </header>
    <main class="container mt-4">
        <section id="lista-produtos" class="row">
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
